name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  DEPENDENCY_RELEASE_TAG: dependencies-windows-x64-v1

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download dependency bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundleArchive = Join-Path $env:RUNNER_TEMP "SensoryGuard-windows-deps-x64.zip"
          gh release download $env:DEPENDENCY_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "SensoryGuard-windows-deps-x64.zip" `
            --output $bundleArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency bundle download failed."
          }

          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE "dependencies"
          New-Item -ItemType Directory -Force -Path $dependencyRoot | Out-Null
          Expand-Archive -Path $bundleArchive -DestinationPath $dependencyRoot -Force
          "SENSORYGUARD_DEPENDENCY_ROOT=$dependencyRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $vcpkgRoot = Join-Path $dependencyRoot "vcpkg\x64-windows"
          $directmlRoot = Join-Path $dependencyRoot "onnxruntime-directml"
          if (-not (Test-Path (Join-Path $vcpkgRoot "share\Qt6\Qt6Config.cmake"))) {
            throw "Qt development files are missing from the dependency bundle."
          }
          if (-not (Test-Path (Join-Path $vcpkgRoot "include\opencv4\opencv2\opencv.hpp"))) {
            throw "OpenCV development files are missing from the dependency bundle."
          }
          if (-not (Test-Path (Join-Path $directmlRoot "runtimes\win-x64\native\onnxruntime.dll"))) {
            throw "ONNX Runtime DirectML files are missing from the dependency bundle."
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $version = "0.0.0-dev"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          cmake -S . -B build-release `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            "-DSENSORYGUARD_DEPENDENCY_ROOT=$env:SENSORYGUARD_DEPENDENCY_ROOT" `
            "-DSENSORYGUARD_VERSION=$version" `
            -DSENSORYGUARD_ENABLE_DIRECTML=ON
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build-release --config $env:BUILD_TYPE --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed."
          }

      - name: Stage package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "package\SensoryGuard"
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "build-release\$env:BUILD_TYPE"
          $archiveName = "SensoryGuard-windows-x64-$env:GITHUB_REF_NAME.zip"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE $archiveName

          if (-not (Test-Path $outputDirectory)) {
            throw "Build output directory was not found: $outputDirectory"
          }

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Path (Join-Path $outputDirectory "*") -Destination $packageRoot -Recurse -Force

          Get-ChildItem -Path $packageRoot -Include "*.pdb", "*.ilk", "*.exp", "*.lib" -File -Recurse |
            Remove-Item -Force

          Compress-Archive -Path $packageRoot -DestinationPath $archivePath -CompressionLevel Optimal -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SensoryGuard-windows-package
          path: SensoryGuard-windows-x64-${{ github.ref_name }}.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: SensoryGuard-windows-package
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "release-assets/SensoryGuard-windows-x64-$GITHUB_REF_NAME.zip" \
            --generate-notes \
            --title "Sensory Guard $GITHUB_REF_NAME"